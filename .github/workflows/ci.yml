# P6.4 ci
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php:
    name: PHP (phpcs + phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer run lint
      - run: composer run analyze

  assets:
    name: Assets (eslint + stylelint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run build
